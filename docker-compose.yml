services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["sh", "./scripts/start.sh"]
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["sh", "./scripts/worker.sh"]
    env_file: .env
    depends_on:
      - api
      - redis
      - postgres

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["sh", "./scripts/scheduler.sh"]
    env_file: .env
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowrenewals
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
