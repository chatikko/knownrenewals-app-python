services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["sh", "./scripts/start.sh"]
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["sh", "./scripts/worker.sh"]
    env_file: .env
    depends_on:
      - api
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["sh", "./scripts/scheduler.sh"]
    env_file: .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - app

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowrenewals
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: nginx:1.25
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - app

networks:
  app:

volumes:
  postgres_data:
  redis_data:
